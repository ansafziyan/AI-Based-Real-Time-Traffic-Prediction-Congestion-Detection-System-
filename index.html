<script>
const labels = [
"Vehicle Count",
"Average Speed (km/h)",
"Road Width (m)",
"Signal Timing (sec)",
"Pedestrian Count",
"Weather Condition (0-1)",
"Time of Day (0-24)",
"Lane Count",
"Accident (0/1)",
"Traffic Density",
"Public Transport",
"Road Condition (0-1)",
"Event Impact"
];

const inputDiv = document.getElementById("inputs");

labels.forEach((label, i) => {
  inputDiv.innerHTML += `
    <div>
      <label>${label}</label><br>
      <input type="number" id="i${i}" placeholder="${label}">
    </div><br>
  `;
});
</script>
