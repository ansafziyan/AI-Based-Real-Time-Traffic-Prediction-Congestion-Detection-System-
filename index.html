<!DOCTYPE html>
<html>
<head>
  <title>Smart Traffic AI</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
      padding: 30px;
    }

    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 15px;
      width: 85%;
      margin: auto;
      box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 90%;
    }

    label {
      font-size: 14px;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    #result {
      margin-top: 20px;
      font-size: 22px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🚦 Smart Traffic Prediction System</h1>
  <p>Enter real-world traffic parameters (0–10 ratings where applicable)</p>

  <div class="grid" id="inputs"></div>

  <button onclick="predict()">Predict Traffic</button>

  <div id="result"></div>
</div>

<script>
const labels = [
"Vehicle Count",
"Average Speed (km/h)",
"Road Width (m)",
"Signal Delay (sec)",
"Pedestrian Count",
"Time of Day (0-24)",
"Lane Count",
"Accident Severity (0-10)",
"Traffic Density (0-10, 10 = very crowded)",
"Public Transport Load (0-10)",
"Road Condition (0-10, 10 = excellent)",
"Driver Behavior (0-10)",
"Congestion History (0-10)"
];

const inputDiv = document.getElementById("inputs");

labels.forEach((label, i) => {
  inputDiv.innerHTML += `
    <div>
      <label>${label}</label><br>
      <input type="number" id="i${i}" placeholder="${label}">
    </div>
  `;
});

async function predict() {
  let values = [];

  for (let i = 0; i < 13; i++) {
    values.push(parseFloat(document.getElementById("i"+i).value) || 0);
  }

  const res = await fetch("/predict", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({input: values})
  });

  const data = await res.json();

  let status = "";
  let color = "";

  if (data.prediction < 25) {
    status = "🟢 Low Traffic";
    color = "#22c55e";
  } 
  else if (data.prediction < 50) {
    status = "🟡 Moderate Traffic";
    color = "#eab308";
  } 
  else if (data.prediction < 75) {
    status = "🟠 High Traffic";
    color = "#f97316";
  } 
  else {
    status = "🔴 Very High Traffic";
    color = "#ef4444";
  }

  document.getElementById("result").innerHTML =
    `<span style="color:${color}">
      Traffic Score: ${data.prediction} / 100 <br>
      Level: ${status}
    </span>`;
}
</script>

</body>
</html>
