<!DOCTYPE html>
<html>
<head>
  <title>Smart Traffic AI</title>

  <style>
    body {
      font-family: Arial;
      background: radial-gradient(circle at top, #0a0a0a, #000000);
      color: white;
      text-align: center;
      padding: 30px;
    }

    .container {
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      width: 500px;
      margin: auto;
      box-shadow: 0px 0px 40px rgba(0, 255, 150, 0.2);
    }

    h1 {
      margin-bottom: 10px;
      color: #22c55e;
    }

    input {
      padding: 12px;
      margin: 10px;
      border-radius: 10px;
      border: none;
      width: 80%;
      background: #111;
      color: white;
      outline: none;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
    }

    input:focus {
      box-shadow: 0 0 10px #22c55e;
    }

    button {
      padding: 12px 25px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 0 15px rgba(34,197,94,0.5);
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(34,197,94,0.8);
    }

    #result {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🚦 Smart Traffic Prediction</h1>
  <p style="color:#aaa;">AI-powered traffic analysis system</p>

  <input type="number" id="i0" placeholder="Vehicle Count (0-200)">
  <input type="number" id="i1" placeholder="Average Speed (0-100 km/h)">
  <input type="number" id="i2" placeholder="Signal Delay (0-180 sec)">
  <input type="number" id="i3" placeholder="Road Width (3-20 m)">
  <input type="number" id="i4" placeholder="Time of Day (0-24)">
  <input type="number" id="i5" placeholder="Road Condition (0-10)">
  <input type="number" id="i6" placeholder="Traffic Density (0-10)">
  <input type="number" id="i7" placeholder="Accident Severity (0-10)">

  <button onclick="predict()">Predict Traffic</button>

  <div id="result"></div>
</div>

<script>
async function predict() {
  let values = [];

  for (let i = 0; i < 8; i++) {
    values.push(parseFloat(document.getElementById("i"+i).value) || 0);
  }

  const res = await fetch("/predict", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({input: values})
  });

  const data = await res.json();

  let status = "";
  let color = "";

  if (data.prediction < 25) {
    status = "🟢 Low Traffic";
    color = "#22c55e";
  } else if (data.prediction < 50) {
    status = "🟡 Moderate Traffic";
    color = "#eab308";
  } else if (data.prediction < 75) {
    status = "🟠 High Traffic";
    color = "#f97316";
  } else {
    status = "🔴 Very High Traffic";
    color = "#ef4444";
  }

  document.getElementById("result").innerHTML =
    `<span style="color:${color}">
      Traffic Score: ${data.prediction}/100 <br>
      ${status}
    </span>`;
}
</script>

</body>
</html>
